<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScreenPal</title>
  <link rel="stylesheet" href="src/css/impeccable-ios.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
    }
  </style>
</head>
<body class="theme-catppuccin">
  <div class="hud-root">
    
    <!-- Top bar: 44px height, clean -->
    <header class="hud-topbar">
      <div class="hud-topbar-left">
        <span class="hud-status-dot"></span>
        <span class="hud-brand" id="header-brand-tag">ScreenPal</span>
      </div>
      <div class="hud-topbar-right">
        <select id="hud-theme-select" class="hud-select" title="Theme">
          <option value="catppuccin">Catppuccin</option>
          <option value="tokyonight">Tokyo Night</option>
          <option value="amberbyte">Amber</option>
          <option value="blueberry">Blueberry</option>
          <option value="rosepine">Rose Pine</option>
          <option value="gruvbox">Gruvbox</option>
          <option value="nordic">Nordic</option>
        </select>
        <button id="btn-dock-left" class="hud-icon-btn" title="Dock Left">◧</button>
        <button id="btn-dock-right" class="hud-icon-btn" title="Dock Right">◨</button>
        <button id="btn-edit-widgets" class="hud-icon-btn" title="Widgets">⊞</button>
      </div>
    </header>

    <!-- Widget area: scrollable, flex column -->
    <main class="hud-widgets" id="widget-container">
      <!-- Widgets injected here by widget-manager.js -->
    </main>

  </div>

  <script src="src/js/fish-friend.js"></script>
  <script src="src/js/widget-manager.js"></script>
  <script src="src/js/secondary-hud.js"></script>
</body>
</html>
